<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Startseite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0B24;
    --ink: #FFFFFF;
    --focus: #6fb1ff;
    --font: "Nunito", "Varela Round", ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  /* Farbige Lichtflächen hinter dem Glas */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(40vmax 40vmax at 18% 22%, rgba(242,119,34,.40), transparent 60%),
      radial-gradient(45vmax 45vmax at 82% 28%, rgba(5,36,163,.75), transparent 62%),
      radial-gradient(40vmax 40vmax at 70% 88%, rgba(104,186,212,.40), transparent 60%),
      radial-gradient(38vmax 38vmax at 25% 85%, rgba(33,116,166,.55), transparent 60%);
    z-index: 0;
  }

  main { position: relative; z-index: 1; width: 100%; max-width: 860px; }

  header { text-align: center; margin-bottom: 56px; }
  h1 {
    font-size: clamp(2.6rem, 8vw, 5rem);
    font-weight: 800;
    margin: 0;
    line-height: 1.1;
    color: var(--ink);
    text-shadow: 0 4px 30px rgba(0,0,0,.35);
  }
  #clock {
    font-size: clamp(1.8rem, 5vw, 3rem);
    font-weight: 600;
    margin-top: 6px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 4px 30px rgba(0,0,0,.35);
  }
  #clock:empty { display: none; }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 22px;
  }
  @media (min-width: 680px) { .grid { grid-template-columns: repeat(4, 1fr); } }

  /* Liquid-Glass-Kachel */
  a.tile {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 30px 12px 22px;
    border-radius: 28px;
    text-decoration: none;
    color: var(--ink);
    background: linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.05));
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid rgba(255,255,255,.22);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.55),
      inset 0 -1px 2px rgba(255,255,255,.12),
      0 18px 40px rgba(0,0,0,.35);
    transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    overflow: hidden;
  }
  /* Glanzlicht oben */
  a.tile::before {
    content: "";
    position: absolute;
    left: 8%; right: 8%; top: 0; height: 45%;
    border-radius: 0 0 50% 50% / 0 0 100% 100%;
    background: linear-gradient(to bottom, rgba(255,255,255,.22), rgba(255,255,255,0));
    pointer-events: none;
  }
  a.tile:hover {
    transform: translateY(-5px) scale(1.03);
    background: linear-gradient(145deg, rgba(255,255,255,.26), rgba(255,255,255,.08));
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.7),
      inset 0 -1px 2px rgba(255,255,255,.18),
      0 26px 50px rgba(0,0,0,.45);
  }
  a.tile:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }

  .icon {
    position: relative;
    width: 72px; height: 72px;
    border-radius: 22px;
    display: grid; place-items: center;
    font-size: 2.1rem;
    border: 1px solid rgba(255,255,255,.4);
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,.6),
      inset 0 -6px 12px rgba(0,0,0,.18),
      0 8px 20px rgba(0,0,0,.3);
  }
  .t1 .icon { background: linear-gradient(145deg, #ff9a4d, #f27722 60%, #c85a0c); }
  .t2 .icon { background: linear-gradient(145deg, #3a58e0, #0524A3 60%, #031a78); }
  .t3 .icon { background: linear-gradient(145deg, #4aa0d6, #2174A6 60%, #175579); }
  .t4 .icon { background: linear-gradient(145deg, #9bd8ea, #68BAD4 60%, #4a9ab6); }

  .name {
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: .01em;
    text-shadow: 0 2px 10px rgba(0,0,0,.35);
  }

  @media (prefers-reduced-motion: reduce) { a.tile { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="greeting">Willkommen</h1>
    <div id="clock"></div>
  </header>

  <!-- Die Kacheln stehen direkt im HTML (ohne Skript), damit sie auch in New Tab Override funktionieren. -->
  <nav class="grid" aria-label="Meine Seiten">
    <a class="tile t1" href="https://claude.ai/chat/660023ea-ff5b-45ee-9a40-e0481fabfdc3">
      <div class="icon">☁️</div><div class="name">Claude</div>
    </a>
    <a class="tile t2" href="https://campus.tum.de/tumonline/ee/ui/ca2/app/desktop/#/home">
      <div class="icon">🏫</div><div class="name">TUM Online</div>
    </a>
    <a class="tile t3" href="https://www.moodle.tum.de/my/">
      <div class="icon">🎓</div><div class="name">TUM Moodle</div>
    </a>
    <a class="tile t4" href="https://mail.tum.de/owa/#path=/mail">
      <div class="icon">✉️</div><div class="name">TUM Mail</div>
    </a>
  </nav>
</main>

<script>
  /* Uhr und Begrüßung: laufen nur, wenn die Seite Skripte ausführen darf. */
  function aktualisieren() {
    var jetzt = new Date();
    var h = jetzt.getHours();
    document.getElementById("greeting").textContent =
      h < 11 ? "Guten Morgen" : h < 18 ? "Guten Tag" : "Guten Abend";
    document.getElementById("clock").textContent =
      jetzt.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  }
  aktualisieren();
  setInterval(aktualisieren, 1000);
</script>
</body>
</html>
